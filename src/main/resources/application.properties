#==========================================
# Spring Cloud Config Client
#==========================================
# Obtencion de propiedades desde el config server (opcional si no hay servidor)
spring.config.import=optional:configserver:

#==========================================
# GestoPago - Autenticacion (PuntoRed; el config server puede sobrescribir)
#==========================================
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.api-key=YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8
gestopago.auth.refresh-rate-ms=3600000

#==========================================
# GestoPago - Integracion solo de datos
#==========================================

# URL base del sistema GestoPago (mismo host usado por la autenticacion)
gestopago.productos.url=${gestopago.auth.url:}

# Token Bearer para consumir el servicio de productos (provisto por configuracion)
gestopago.productos.token=

# Timeouts en milisegundos del cliente de productos
gestopago.productos.connect-timeout-ms=5000
gestopago.productos.read-timeout-ms=10000

#==========================================
# GestoPago - Sincronizacion de productos
#==========================================

# Expresion cron del disparador programado (06:00 AM)
gestopago.productos.cron=0 0 6 * * *

# Antiguedad maxima (horas) de los datos antes de forzar una nueva sincronizacion
gestopago.productos.consulta.max-antiguedad-horas=24

#==========================================
# PostgreSQL - Conector (ConfigDB/Flyway/JPA)
#==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://3e-28w.h.filess.io:5432/Prueba_Pagos_wheelusing}
spring.datasource.username=${DB_USER:Prueba_Pagos_wheelusing}
spring.datasource.password=${DB_PASSWORD:eb6f3bad1a611f18e5596edaf31919f20e0d955f}

# Flyway: el proveedor de hosting no da permisos en schema 'public', pero el usuario
# puede crear en su propio schema (app). Las migraciones se aplican ahi.
spring.flyway.enabled=true
spring.flyway.schemas=app

# Esquema por defecto de JPA: objetos del usuario creados en 'app'
spring.jpa.properties.hibernate.default_schema=app

